<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="CCLMS">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f5fa7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0b4f91;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="128" cy="128" r="128" fill="url(#gradient)"/>
  
  <!-- Border ring -->
  <circle cx="128" cy="128" r="128" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.15"/>
  
  <!-- Book icon -->
  <g transform="translate(128, 128)">
    <!-- Left page -->
    <path d="M -35 -40 L -35 40 Q -30 45 -20 45 L 0 45 L 0 -45 L -20 -45 Q -30 -45 -35 -40" fill="#ffffff" opacity="0.9"/>
    
    <!-- Right page -->
    <path d="M 35 -40 L 35 40 Q 30 45 20 45 L 0 45 L 0 -45 L 20 -45 Q 30 -45 35 -40" fill="#ffffff"/>
    
    <!-- Book spine -->
    <rect x="-2" y="-45" width="4" height="90" fill="#0b4f91"/>
    
    <!-- Decorative lines on pages -->
    <line x1="-25" y1="-20" x2="-8" y2="-20" stroke="#0f5fa7" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <line x1="-25" y1="-5" x2="-8" y2="-5" stroke="#0f5fa7" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <line x1="-25" y1="10" x2="-8" y2="10" stroke="#0f5fa7" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    
    <line x1="8" y1="-20" x2="25" y2="-20" stroke="#0f5fa7" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <line x1="8" y1="-5" x2="25" y2="-5" stroke="#0f5fa7" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <line x1="8" y1="10" x2="25" y2="10" stroke="#0f5fa7" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>